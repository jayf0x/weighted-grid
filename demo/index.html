    />

      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600;6..96,700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Paint the right theme before first paint — no flash. `_setTheme` is the single writer, so
      // the root class and localStorage can never disagree; the React toggle calls it too.
      window._setTheme = function (theme) {
        if (theme === "system" || theme == null) localStorage.removeItem("theme");
        else localStorage.setItem("theme", theme);
        var root = document.documentElement;
        root.classList.remove("light", "dark", "system");
        root.classList.add(theme || "system");
      };
      window._setTheme(localStorage.getItem("theme"));
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
